# SCENARIO 2 — FIXED. monitor-sa gets read-only observability instead of the
# impersonate verb. It can no longer act as any other identity.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: readonly-monitor
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: monitor-readonly
subjects:
  - kind: ServiceAccount
    name: monitor-sa
    namespace: security
roleRef:
  kind: ClusterRole
  name: readonly-monitor
  apiGroup: rbac.authorization.k8s.io
