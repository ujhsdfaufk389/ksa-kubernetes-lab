# SCENARIO 8 — Wildcard RBAC in a namespace that hosts a privileged SA.
#
# production/wildcard-sa has verbs:["*"] resources:["*"] in production. That
# includes creating pods, so it can run a pod as production/admin-sa.
#   production/wildcard-sa --CREATE_POD_AS@production--> production/admin-sa --IS_CLUSTER_ADMIN--> cluster-admin
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wildcard-sa
  namespace: production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: do-anything
  namespace: production
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wildcard-sa-anything
  namespace: production
subjects:
  - kind: ServiceAccount
    name: wildcard-sa
    namespace: production
roleRef:
  kind: Role
  name: do-anything
  apiGroup: rbac.authorization.k8s.io
