[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ksa-detector"
version = "0.4.0"
description = "Kubernetes ServiceAccount privilege-escalation detector (graph-based multi-hop + audit correlation)"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "kubernetes>=31",
  "networkx>=3.4",
  "pydantic>=2.10",
  "PyYAML>=6",
  "rich>=13",
  "typer>=0.15",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "jinja2>=3.1",
]

[project.scripts]
ksa-detector = "ksa.cli:main"

[tool.setuptools.packages.find]
include = ["ksa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
